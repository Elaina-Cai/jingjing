# 重构计划（机器可读）—— 与 docs/重构总纲.md 的 E0–E4 一一对应
#
# 字段约定：
#   id          切片编号（U-xx），全局唯一；提交信息里引用它
#   stage       E0 / E1 / E2 / E3 / E4
#   files       允许改动的文件；新增文件写成 "路径:: new"
#   interfaces  这一片新引入的签名（写清楚，免得实现时自由发挥）
#   migration   需要的迁移号；null 表示不动库
#   flags       新增/使用的开关（含默认态）；null 表示不加开关
#   acceptance  验收命令 + 期望输出（必须是本仓库能跑的命令）
#   rollback    回滚动作（一句话，必须可执行）
#   risk        最大的风险点（写"最坏会发生什么"）
#
# 纪律：一个切片 = 一次提交（或一组紧邻提交）；不许跨片批量提交。
version: 1
aliases:
  MIGRATION_NEXT: 63   # 现状 62 个迁移；新迁移从这里开始，按片顺延
slices:
  - id: U-00
    stage: E0
    title: 封死账本清空入口（clear 需显式授权）
    why: 生产代码里存在 TerminalEventStore.clear()，虽无生产调用者，但它是唯一能整表删除的路径
    files:
      - core/terminal/event_store_db.py
      - tests/test_event_chain_links.py
    interfaces:
      - "TerminalEventStore.clear(self, *, allow_clear: bool = False) -> None"
    migration: null
    flags: null
    acceptance:
      - "cmd: .\\.venv_it\\Scripts\\python.exe -u scripts\\run_all_tests.py --filter events"
      - "expect: RESULT n/n passed（且无新的失败）"
      - "cmd: .\\.venv_it\\Scripts\\python.exe -X utf8 -u scripts\\check_invariants.py"
      - "expect: I1b 显示 clear() 需 allow_clear=True"
    rollback: 还原 event_store_db.py 的 clear 签名（单文件 git checkout）
    risk: 若有运维脚本依赖无参 clear()，会立刻 TypeError —— 这是期望行为，改脚本传 allow_clear=True

  - id: U-01
    status: done
    stage: E0
    title: 判决行留痕（每回合一行，进账本旁注）
    why: 没有留痕就没有开口率/弃权率/basis 指回率，后面每一阶段都无法验收
    files:
      - core/terminal/turn_trace.py
      - core/routing/turn_pipeline.py
      - core/features.py
      - db/migrations.py
      - scripts/report_turn_trace.py
      - tests/test_turn_trace.py
      - tests/test_flag_reader_discipline.py
      - tests/test_env_flag_isolation.py
    interfaces:
      - "record_turn_trace(*, turn_id: str, chat_id: str, decision: str, basis: Sequence[str] | None, ts: datetime) -> None"
      - "iter_turn_trace(*, since: datetime, until: datetime | None = None) -> Iterable[TurnTraceRow]"
    migration: 63
    flags: "TURN_TRACE: off|shadow|on（默认 off）"
    notes: >
      开关总数断言分散在多个测试（用 `Select-String -Path tests\\*.py -Pattern 'len\(features\.TRI_STATE_FLAGS\)'` 全量搜），加开关时必须把每一处 75 改成新值，
      并在 `tests/test_env_flag_isolation.py` 的 STANDALONE_SWITCHES 里登记，否则 flag_reader 会红。
      表约束：`turn_id` 主键（等价 UNIQUE），重复写为 no-op；行上带 `mode` 列，shadow 也落库（否则连续 7 天读数没有数据源）。
      写入点只能是 decision 定稿后的唯一收口（`core/routing/turn_decision.py:80` 有 8 个 silent 出口，不许各写一遍）。
    acceptance:
      - "cmd: python -X utf8 -u tests\\test_turn_trace.py"
      - "expect: RESULT 0 failed"
      - "cmd: .\\.venv_it\\Scripts\\python.exe -u scripts\\run_all_tests.py --filter events"
      - "expect: RESULT n/n passed"
      - "cmd: .\\.venv_it\\Scripts\\python.exe -u scripts\\run_all_tests.py --filter flag"
      - "expect: RESULT n/n passed（开关总数断言已同步）"
      - "cmd: .\\.venv_it\\Scripts\\python.exe -X utf8 -u scripts\\report_turn_trace.py --days 1"
      - "expect: 输出 开口率/弃权率/沉默率/覆盖率/指回率，且样本数为当天判决行数"
      - "cmd: 同上，但 .env 里 TURN_TRACE=off 后重启"
      - "expect: 输出 TURN_TRACE=off, 0 rows 且 exit 0"
    rollback: TURN_TRACE=off（不再写）；迁移 63 只新增表，回滚不需要
    risk: 开关落到 .env 却忘记重启 → 读数全 0；验收时必须打印启动时的 flag 快照

