      ui_control 永远逐次；external_send 即使批准也不许从执行器走（只走出口）。停下时回执带 tier 与卡点原因。
      三条硬红线（办_在手的事.md §8）进 check_invariants：无 approval 不调出口、隐私/金额不进群、job 不持有平台通道。
