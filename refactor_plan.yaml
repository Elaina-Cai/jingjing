      写回执必须是**状态差异式**的（state_before / state_after / changed）：changed 为空即 no_change，
      执行器判失败、台账里也带着前后摘要 —— 写操作没有幂等键，只能靠状态比较证明「真的变了」。
      三级授权落地（core/jobs/policy.py）：read 免批准；write_local 只在**人批过**的长期授权
